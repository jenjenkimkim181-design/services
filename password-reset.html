<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f6f1e8">
<title>Reset Password | DESCANSO COMIDA + CAFE</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
:root{--ink:#27352c;--muted:#758078;--paper:#f6f1e8;--card:#fffdf8;--line:#e6e0d5;--green:#34483b;--gold:#c39b63}
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px;display:grid;place-items:center;background:var(--paper);color:var(--ink);font-family:Arial,sans-serif}
.card{width:min(100%,460px);padding:clamp(26px,6vw,44px);background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 55px #29372b12}
.brand{font-size:12px;letter-spacing:.2em;color:var(--gold);font-weight:700}.eyebrow{margin:30px 0 9px;font-size:11px;letter-spacing:.16em;color:var(--muted);font-weight:700}h1{font-family:Georgia,serif;font-size:clamp(32px,7vw,42px);font-weight:400;margin:0 0 12px}h1 em{color:#8a9a83}p{color:var(--muted);line-height:1.65;font-size:14px;margin:0 0 24px}label{display:block;font-size:13px;font-weight:700;margin:17px 0 7px}input{width:100%;padding:14px 13px;border:1px solid var(--line);border-radius:9px;background:white;font:inherit;outline:none}input:focus{border-color:#839782;box-shadow:0 0 0 3px #83978220}button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:9px;background:var(--green);color:white;font-weight:700;font-size:14px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.message{min-height:22px;margin:16px 0 0;font-size:13px}.message.error{color:#a33c35}.message.success{color:#34734b}.back{display:block;text-align:center;margin-top:18px;color:var(--green);font-size:13px;text-decoration:none}.hidden{display:none!important}
</style>
</head>
<body>
<main class="card">
 <div class="brand">DESCANSO COMIDA + CAFE</div>
 <div class="eyebrow">ACCOUNT SECURITY</div>
 <h1>Reset your <em>password.</em></h1>
 <p id="intro">Please wait while we securely verify your password recovery link.</p>
 <form id="passwordForm" class="hidden">
  <label for="newPassword">New password</label>
  <input id="newPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters">
  <label for="confirmPassword">Confirm new password</label>
  <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="Enter your password again">
  <button id="updateButton" type="submit">Update password</button>
 </form>
 <p id="message" class="message" role="status" aria-live="polite"></p>
 <a id="backLink" class="back hidden" href="https://digitized-droid.github.io/services/">Return to website</a>
</main>
<script>
(() => {
 const $=id=>document.getElementById(id);
 let supa=null, verified=false, finished=false;
 function showMessage(text,type=''){ $('message').textContent=text; $('message').className='message '+type; }
 function invalid(text){
   verified=false;$('passwordForm').classList.add('hidden');
   $('intro').textContent=text;$('backLink').classList.remove('hidden');
 }
 async function init(){
  if(!window.supabase||!window.DESCANSO_SUPABASE_URL||!window.DESCANSO_SUPABASE_PUBLISHABLE_KEY){
   invalid('Password recovery is temporarily unavailable. Please contact the website administrator.');return;
  }
  supa=window.supabase.createClient(window.DESCANSO_SUPABASE_URL,window.DESCANSO_SUPABASE_PUBLISHABLE_KEY);
  const hash=new URLSearchParams(location.hash.slice(1));
  const query=new URLSearchParams(location.search);
  if(hash.get('error')||query.get('error')){
   invalid(hash.get('error_description')||query.get('error_description')||'This recovery link is invalid or has expired. Please request a new one.');return;
  }
  supa.auth.onAuthStateChange(async(event,session)=>{
   if(event==='PASSWORD_RECOVERY'&&session){
    verified=true;$('intro').textContent='Your email confirmation is verified. Choose a new password for your account.';
    $('passwordForm').classList.remove('hidden');showMessage('');
   }
  });
  const {data,error}=await supa.auth.getSession();
  if(error){invalid('We could not verify this recovery link. Please request a new one.');return}
  if(data.session && (hash.get('type')==='recovery'||query.has('code'))){
   verified=true;$('intro').textContent='Your email confirmation is verified. Choose a new password for your account.';
   $('passwordForm').classList.remove('hidden');return;
  }
  if(!verified){
   // Give the Supabase URL handler a moment to exchange the recovery token.
   setTimeout(async()=>{
    const {data:{session}}=await supa.auth.getSession();
    if(session&&location.hash.includes('type=recovery')){
     verified=true;$('intro').textContent='Your email confirmation is verified. Choose a new password for your account.';
     $('passwordForm').classList.remove('hidden');
    }else if(!verified)invalid('This recovery link is invalid, expired, or has already been used. Please request a new password recovery email.');
   },1200);
  }
 }
 $('passwordForm').addEventListener('submit',async e=>{
  e.preventDefault();if(!verified||finished)return;
  const password=$('newPassword').value,confirm=$('confirmPassword').value;
  if(password.length<8){showMessage('Please use a password with at least 8 characters.','error');return}
  if(password!==confirm){showMessage('The passwords do not match.','error');return}
  $('updateButton').disabled=true;$('updateButton').textContent='Updating…';
  try{
   const {error}=await supa.auth.updateUser({password});if(error)throw error;
   finished=true;verified=false;$('passwordForm').classList.add('hidden');
   $('intro').textContent='Your password has been successfully updated. You can now return to the website and sign in with your new password.';
   showMessage('Password updated successfully.','success');$('backLink').classList.remove('hidden');
   await supa.auth.signOut();
   history.replaceState({},document.title,location.pathname);
  }catch(err){showMessage(err.message||'Could not update your password. Please request a new recovery link.','error')}
  finally{if(!finished){$('updateButton').disabled=false;$('updateButton').textContent='Update password'}}
 });
 init();
})();
</script>
</body>
</html>
